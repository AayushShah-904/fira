name: Sync Rates to Production VM

on:
  workflow_dispatch:
  # schedule:
  #   # Run daily at 10:30 AM IST (05:00 UTC) after RBI rate disclosures
  #   # NOTE: Schedule disabled — VM is currently off. Uncomment when VM is running again.
  #   - cron: '0 5 * * 1-6'

permissions:
  id-token: write
  contents: read

jobs:
  sync-rates:
    name: Sync Latest Rates to VM Database
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login (via OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Execute Rate Sync on VM
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            az vm run-command invoke \
              --resource-group sandbox-rg \
              --name bo-sandbox-vm-india \
              --command-id RunShellScript \
              --scripts "
                set -e
                echo '=== Running Rate Sync on Azure VM ==='
                cd /opt/fira/api
                if [ -f sync-rates.js ]; then
                  node sync-rates.js
                fi
                sudo systemctl restart fira-api
                echo '=== Rate Sync Completed Successfully ==='
              "

