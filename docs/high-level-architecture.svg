    <rect class="bx m" x="1334" y="830" width="308" height="46" rx="2"/>
    <text class="t s" x="1488" y="857" text-anchor="middle">Mainland bank holds the money</text>
    <text class="lab" x="24" y="910">TRUE OF EVERY LAYER</text>
    <rect class="bx " x="24" y="922" width="533" height="124" rx="2"/>
    <text class="t " x="38" y="950">Security</text>
    <text class="d" x="38" y="972">one partner cannot see another — the database enforces it</text>
    <text class="d" x="38" y="990">every request signed, and it can only take effect once</text>
    <text class="d" x="38" y="1008">keys live in a hardware module and are never exported</text>
    <text class="d" x="38" y="1026">if screening is unavailable, money does not move</text>
    <rect class="bx " x="573" y="922" width="533" height="124" rx="2"/>
    <text class="t " x="587" y="950">Monitoring</text>
    <text class="d" x="587" y="972">one trace follows a request even across queues</text>
    <text class="d" x="587" y="990">every number can be broken down per partner</text>
    <text class="d" x="587" y="1008">we alert on customers being affected, not on CPU</text>
    <text class="d" x="587" y="1026">a reconciliation break pages someone</text>
    <rect class="bx " x="1122" y="922" width="533" height="124" rx="2"/>
    <text class="t " x="1136" y="950">Staying up</text>
    <text class="d" x="1136" y="972">one product line failing does not take the others with it</text>
    <text class="d" x="1136" y="990">everything retries safely, nothing double-charges</text>
    <text class="d" x="1136" y="1008">two copies in India, standby tested every quarter</text>
    <text class="d" x="1136" y="1026">when something breaks, it says so instead of guessing</text>
