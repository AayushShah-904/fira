<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1680 1020" role="img" aria-label="Simple system overview. Partner institutions, their customers and partner operations teams connect through embedded screens, an API with webhooks, a partner console and an operations console. In the middle sits the Bharatomni platform carrying eight products - deposits, FCNR deposits, payments, funds, shares and bonds, insurance, pension and sending money abroad - over shared building blocks. It connects outward to GIFT City counterparties including a GIFT bank, a GIFT AMC, the FCSS settlement system and a custodian, and outside GIFT City to a mainland bank for FCNR deposits, the SWIFT network, screening vendors and partner systems. It runs on Azure and is protected by database-level partner isolation, signed requests, compliance checks that never skip, and two copies in India.">
<style>
  .dg{--surface:#FFFFFF;--sunk:#EDF2EF;--band:#F0F4F2;--line:#CBD7D3;--ink:#0F1D1C;--muted:#576A67;
      --gift:#0C6F62;--main:#2F4FC4;--out:#A9620C;--alert:#9E2F46;
      --sans:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
      --mono:"IBM Plex Mono",ui-monospace,"DejaVu Sans Mono",Menlo,monospace;
      background:var(--surface)}
  @media (prefers-color-scheme:dark){
    .dg{--surface:#0F1B1A;--sunk:#0C1716;--band:#0B1615;--line:#2A4340;--ink:#E2EDEA;--muted:#93A9A5;
        --gift:#3BBCA4;--main:#8FA6F4;--out:#E2A54B;--alert:#E8798D}
  }
  .dg text{font-family:var(--sans);fill:var(--ink)}
  .dg .bx{fill:var(--surface);stroke:var(--line);stroke-width:1.3}
  .dg .bx.q{fill:var(--sunk)}
  .dg .bx.g{stroke:var(--gift)}
  .dg .bx.m{stroke:var(--main);stroke-dasharray:6 4}
  .dg .bx.o{stroke:var(--out)}
  .dg .bandbg{fill:var(--band);stroke:none}
  .dg .rowbg{fill:var(--sunk);stroke:none}
  .dg .t{font-size:15px;font-weight:600;letter-spacing:-.005em}
  .dg .t.s{font-size:13px}
  .dg .d{font-size:11px;font-family:var(--mono);fill:var(--muted)}
  .dg .lab{font-size:11px;font-family:var(--mono);letter-spacing:.14em;fill:var(--muted)}
  .dg .num{font-size:18px;font-weight:700;fill:var(--gift)}
  .dg .hd{font-size:25px;font-weight:700;letter-spacing:-.022em}
  .dg .cg{fill:var(--gift)} .dg .cm{fill:var(--main)} .dg .co{fill:var(--out)}
  .dg .ca{fill:var(--alert)} .dg .cmu{fill:var(--muted)}
  .dg .rule{stroke:var(--line);stroke-width:1}
  .dg .chev{fill:var(--gift)} .dg .chevm{fill:var(--main)}
  .dg .mk{fill:var(--gift)} .dg .mk.u{fill-opacity:.42}
  .dg .ring{fill:none;stroke:var(--gift);stroke-width:1.5}
  .dg .non{stroke:var(--line);stroke-width:1.6}
</style>

    <text class="hd" x="24" y="34">How it works</text>
    <text class="lab" x="1656" y="34" text-anchor="end">ONE PLATFORM · TWO REGULATORS</text>
    <line class="rule" x1="24" y1="52" x2="1656" y2="52"/>
    <text class="lab" x="24" y="84">WHO USES IT</text>
    <rect class="bx " x="24" y="96" width="533" height="86" rx="2"/>
    <text class="t " x="38" y="124">Partner institutions</text>
    <text class="d" x="38" y="146">banks, NBFCs, fintechs, wealth platforms</text>
    <text class="d" x="38" y="164">they own the customer — we provide the rails</text>
    <rect class="bx " x="573" y="96" width="533" height="86" rx="2"/>
    <text class="t " x="587" y="124">Their customers</text>
    <text class="d" x="587" y="146">NRIs and global investors putting money in</text>
    <text class="d" x="587" y="164">residents in India sending money out</text>
    <rect class="bx " x="1122" y="96" width="533" height="86" rx="2"/>
    <text class="t " x="1136" y="124">Partner operations teams</text>
    <text class="d" x="1136" y="146">reconciliation, audit and reporting</text>
    <text class="d" x="1136" y="164">self-serve consoles, not support tickets</text>
    <text class="lab" x="24" y="214">HOW THEY CONNECT</text>
    <rect class="bx " x="24" y="226" width="396" height="70" rx="2"/>
    <text class="t " x="222" y="253" text-anchor="middle">Embedded screens</text>
    <text class="d" x="222" y="273" text-anchor="middle">our screens, their brand</text>
    <rect class="bx " x="436" y="226" width="396" height="70" rx="2"/>
    <text class="t " x="634" y="253" text-anchor="middle">API and webhooks</text>
    <text class="d" x="634" y="273" text-anchor="middle">everything the screens can do</text>
    <rect class="bx " x="848" y="226" width="396" height="70" rx="2"/>
    <text class="t " x="1046" y="253" text-anchor="middle">Partner console</text>
    <text class="d" x="1046" y="273" text-anchor="middle">keys, testing, replay</text>
    <rect class="bx " x="1260" y="226" width="396" height="70" rx="2"/>
    <text class="t " x="1458" y="253" text-anchor="middle">Operations console</text>
    <text class="d" x="1458" y="273" text-anchor="middle">audit and reconciliation</text>
    <text class="lab" x="24" y="328">WHAT SITS IN THE MIDDLE</text>
    <rect class="bx q g" x="24" y="340" width="1632" height="204" rx="3"/>
    <text class="t cg" x="48" y="370">The Bharatomni platform — one integration, many products</text>
    <text class="d" x="48" y="392">A request passes the front door (blocks attacks), then the gateway (checks who is calling), then our services. Products on top, shared building blocks underneath.</text>
    <rect class="bx g" x="48" y="406" width="189" height="54" rx="2"/>
    <text class="t s" x="142" y="433" text-anchor="middle">Deposits</text>
    <rect class="bx m" x="247" y="406" width="189" height="54" rx="2"/>
    <text class="t s cm" x="341" y="433" text-anchor="middle">FCNR deposits</text>
    <rect class="bx g" x="446" y="406" width="189" height="54" rx="2"/>
    <text class="t s" x="540" y="433" text-anchor="middle">Payments</text>
    <rect class="bx g" x="645" y="406" width="189" height="54" rx="2"/>
    <text class="t s" x="739" y="433" text-anchor="middle">Funds</text>
    <rect class="bx g" x="844" y="406" width="189" height="54" rx="2"/>
    <text class="t s" x="938" y="433" text-anchor="middle">Shares &amp; bonds</text>
    <rect class="bx g" x="1043" y="406" width="189" height="54" rx="2"/>
    <text class="t s" x="1137" y="433" text-anchor="middle">Insurance</text>
    <rect class="bx g" x="1242" y="406" width="189" height="54" rx="2"/>
    <text class="t s" x="1336" y="433" text-anchor="middle">Pension</text>
    <rect class="bx o" x="1441" y="406" width="189" height="54" rx="2"/>
    <text class="t s co" x="1535" y="433" text-anchor="middle">Send abroad</text>
    <rect class="bx " x="48" y="472" width="308" height="54" rx="2"/>
    <text class="t s" x="202" y="499" text-anchor="middle">One customer record</text>
    <rect class="bx " x="366" y="472" width="308" height="54" rx="2"/>
    <text class="t s" x="520" y="499" text-anchor="middle">One ledger</text>
    <rect class="bx " x="684" y="472" width="308" height="54" rx="2"/>
    <text class="t s" x="838" y="499" text-anchor="middle">Limits and tax status</text>
    <rect class="bx " x="1002" y="472" width="308" height="54" rx="2"/>
    <text class="t s" x="1156" y="499" text-anchor="middle">Compliance checks</text>
    <rect class="bx " x="1320" y="472" width="308" height="54" rx="2"/>
    <text class="t s" x="1474" y="499" text-anchor="middle">Notifications and webhooks</text>
    <text class="lab" x="24" y="572">WHO WE CONNECT TO</text>
    <rect class="bx q g" x="24" y="584" width="808" height="130" rx="3"/>
    <text class="t s cg" x="48" y="608">In GIFT City — regulated by IFSCA</text>
    <rect class="bx " x="48" y="622" width="182" height="76" rx="2"/>
    <text class="t s" x="139" y="649" text-anchor="middle">GIFT bank (IBU)</text>
    <text class="d" x="139" y="669" text-anchor="middle">deposits and treasury</text>
    <rect class="bx " x="240" y="622" width="182" height="76" rx="2"/>
    <text class="t s" x="331" y="649" text-anchor="middle">GIFT AMC (FME)</text>
    <text class="d" x="331" y="669" text-anchor="middle">funds, NAV, units</text>
    <rect class="bx " x="432" y="622" width="182" height="76" rx="2"/>
    <text class="t s" x="523" y="649" text-anchor="middle">FCSS</text>
    <text class="d" x="523" y="669" text-anchor="middle">fast dollar settlement</text>
    <rect class="bx " x="624" y="622" width="182" height="76" rx="2"/>
    <text class="t s" x="715" y="649" text-anchor="middle">Custodian &amp; exchange</text>
    <text class="d" x="715" y="669" text-anchor="middle">orders and holdings</text>
    <rect class="bx q" x="848" y="584" width="808" height="130" rx="3"/>
    <text class="t s" x="872" y="608">Outside GIFT City</text>
    <rect class="bx m" x="872" y="622" width="182" height="76" rx="2"/>
    <text class="t s cm" x="963" y="649" text-anchor="middle">Mainland bank</text>
    <text class="d" x="963" y="669" text-anchor="middle">FCNR deposits — RBI</text>
    <rect class="bx " x="1064" y="622" width="182" height="76" rx="2"/>
    <text class="t s" x="1155" y="649" text-anchor="middle">SWIFT network</text>
    <text class="d" x="1155" y="669" text-anchor="middle">cross-border payments</text>
    <rect class="bx " x="1256" y="622" width="182" height="76" rx="2"/>
    <text class="t s" x="1347" y="649" text-anchor="middle">Screening vendors</text>
    <text class="d" x="1347" y="669" text-anchor="middle">sanctions and AML</text>
    <rect class="bx " x="1448" y="622" width="182" height="76" rx="2"/>
    <text class="t s" x="1539" y="649" text-anchor="middle">Partner systems</text>
    <text class="d" x="1539" y="669" text-anchor="middle">we send them webhooks</text>
    <text class="d" x="24" y="736">FCSS settles US dollars between GIFT City banks in near real time. SWIFT is still the route for anything that has to leave GIFT City. Payments picks the route per instruction.</text>
    <text class="lab" x="24" y="772">WHERE IT RUNS — MICROSOFT AZURE</text>
    <rect class="bx " x="24" y="784" width="195" height="70" rx="2"/>
    <text class="t s" x="121" y="811" text-anchor="middle">Front Door</text>
    <text class="d" x="121" y="831" text-anchor="middle">blocks attacks</text>
    <rect class="bx " x="229" y="784" width="195" height="70" rx="2"/>
    <text class="t s" x="326" y="811" text-anchor="middle">API Management</text>
    <text class="d" x="326" y="831" text-anchor="middle">checks callers</text>
    <rect class="bx " x="434" y="784" width="195" height="70" rx="2"/>
    <text class="t s" x="531" y="811" text-anchor="middle">Kubernetes</text>
    <text class="d" x="531" y="831" text-anchor="middle">runs our services</text>
    <rect class="bx " x="639" y="784" width="195" height="70" rx="2"/>
    <text class="t s" x="736" y="811" text-anchor="middle">PostgreSQL</text>
    <text class="d" x="736" y="831" text-anchor="middle">the ledger</text>
    <rect class="bx " x="844" y="784" width="195" height="70" rx="2"/>
    <text class="t s" x="941" y="811" text-anchor="middle">Redis</text>
    <text class="d" x="941" y="831" text-anchor="middle">sessions and limits</text>
    <rect class="bx " x="1049" y="784" width="195" height="70" rx="2"/>
    <text class="t s" x="1146" y="811" text-anchor="middle">Service Bus</text>
    <text class="d" x="1146" y="831" text-anchor="middle">queues and events</text>
    <rect class="bx " x="1254" y="784" width="195" height="70" rx="2"/>
    <text class="t s" x="1351" y="811" text-anchor="middle">Key Vault HSM</text>
    <text class="d" x="1351" y="831" text-anchor="middle">keys, never exported</text>
    <rect class="bx " x="1459" y="784" width="195" height="70" rx="2"/>
    <text class="t s" x="1556" y="811" text-anchor="middle">Firewall + NAT</text>
    <text class="d" x="1556" y="831" text-anchor="middle">controls what we call</text>
    <text class="lab" x="24" y="890">WHAT KEEPS IT SAFE</text>
    <rect class="bx " x="24" y="902" width="396" height="92" rx="2"/>
    <text class="t s" x="38" y="930">One partner cannot see another</text>
    <text class="d" x="38" y="952">enforced by the database itself,</text>
    <text class="d" x="38" y="970">not by remembering to filter</text>
    <rect class="bx " x="436" y="902" width="396" height="92" rx="2"/>
    <text class="t s" x="450" y="930">Every request is signed</text>
    <text class="d" x="450" y="952">and can only take effect once,</text>
    <text class="d" x="450" y="970">however many times it arrives</text>
    <rect class="bx " x="848" y="902" width="396" height="92" rx="2"/>
    <text class="t s" x="862" y="930">Compliance is never skipped</text>
    <text class="d" x="862" y="952">if screening is unavailable,</text>
    <text class="d" x="862" y="970">money does not move</text>
    <rect class="bx " x="1260" y="902" width="396" height="92" rx="2"/>
    <text class="t s" x="1274" y="930">Two copies, both in India</text>
    <text class="d" x="1274" y="952">Central India live,</text>
    <text class="d" x="1274" y="970">South India standby</text>
</svg>
